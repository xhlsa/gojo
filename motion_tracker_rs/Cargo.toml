[package]
name = "motion_tracker_rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "motion_tracker"
path = "src/main.rs"

[[bin]]
name = "dashboard"
path = "src/bin/dashboard.rs"

[lib]
name = "motion_tracker_rs"
path = "src/lib.rs"
# cdylib  → Android .so (loaded via System.loadLibrary)
# rlib    → linked into the desktop motion_tracker / replay binaries
crate-type = ["cdylib", "rlib"]

# ── Dependencies available on every target ────────────────────────────────────
[dependencies]
ndarray = "0.15"
nalgebra = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1.0"
crossbeam = "0.8"
flate2 = "1.0"
glam = "0.24"

# ── Android-only ──────────────────────────────────────────────────────────────
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# ── Desktop-only (Termux runner, replay binary, dashboard) ───────────────────
# These are never compiled into the Android .so.
[target.'cfg(not(target_os = "android"))'.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.26"
rerun = "0.15"
futures = "0.3"

[dev-dependencies]
approx = "0.5"
